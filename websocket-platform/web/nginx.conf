server {
    listen 80;
    server_name localhost;

    # 静态文件根目录
    root /home/ai_agent/websocket-platform/web;

    # 默认首页
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
